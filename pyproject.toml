[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-ai-ocr"
version = "0.1.0"
description = "Self-hosted Thai bank slip OCR for SCB and Krungthai"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pillow>=10.4,<12",
  "numpy>=1.26,<3",
  "paddleocr==3.3.0",
  "paddlex[ocr-core]>=3.3.0,<3.4.0",
  "paddlepaddle>=3.2,<3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
